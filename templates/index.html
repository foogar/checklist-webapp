<!DOCTYPE html>
<html lang="en" x-data="app()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Checklist</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <div class="max-w-4xl mx-auto px-4 py-4 sm:py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-4 pb-3 border-b border-gray-200 dark:border-gray-800">
            <!-- Checklists link triggers List Overview -->
            <button @click="showOverview()" class="text-xl font-bold tracking-tight hover:text-blue-600 dark:hover:text-blue-400 transition">
                Checklists
            </button>
            
            <div class="flex items-center space-x-3">
                <!-- Dark Mode Toggle -->
                <button @click="toggleDarkMode()" class="p-1.5 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
                    <svg x-show="!darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg x-show="darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>

                <!-- Auth Section -->
                <template x-if="user">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-medium text-gray-600 dark:text-gray-300" x-text="user.name"></span>
                        <a href="/auth/logout" class="text-xs text-red-600 dark:text-red-400 hover:underline">Logout</a>
                    </div>
                </template>
                <template x-if="!user">
                    <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                        Sign in
                    </a>
                </template>
            </div>
        </header>

        <!-- Main Content (Only if Logged In) -->
        <template x-if="user">
            <div>
                <!-- Tabs & New List Button Row -->
                <div class="mb-4 flex items-center justify-between gap-2 overflow-x-auto pb-2 border-b border-gray-200 dark:border-gray-800">
                    <div class="flex items-center gap-2 flex-nowrap">
                        <!-- All Lists Overview Button -->
                        <button @click="showOverview()"
                                :class="!activeList ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700'"
                                class="px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1 whitespace-nowrap">
                            <span>☰ All Lists</span>
                        </button>

                        <!-- Individual List Tabs -->
                        <template x-for="list in lists" :key="list.id">
                            <button @click="selectList(list)"
                                    :class="activeList && activeList.id === list.id ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700'"
                                    class="px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 whitespace-nowrap">
                                <span x-text="list.title"></span>
                                <span x-show="list.owner_name && list.owner_name !== user.name" class="text-[10px] opacity-75" x-text="'(' + list.owner_name + ')'"></span>
                            </button>
                        </template>
                    </div>

                    <!-- New List Trigger Inline -->
                    <button @click="showNewListModal = true" class="whitespace-nowrap bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shrink-0">
                        + New
                    </button>
                </div>

                <!-- OVERVIEW DASHBOARD VIEW (Shown when no active list is selected) -->
                <template x-if="!activeList">
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Your Checklists</h2>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" x-show="lists.length > 0">
                            <template x-for="list in lists" :key="list.id">
                                <div @click="selectList(list)" class="cursor-pointer bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 hover:border-blue-500 dark:hover:border-blue-500 transition">
                                    <div class="flex justify-between items-start mb-2">
                                        <h3 class="font-medium text-sm text-gray-900 dark:text-gray-100" x-text="list.title"></h3>
                                        <span x-show="list.is_resettable" class="text-[10px] px-2 py-0.5 bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300 rounded-full">Reset</span>
                                    </div>
                                    <div class="flex justify-between items-center text-xs text-gray-500 dark:text-gray-400">
                                        <span x-text="list.owner_name && list.owner_name !== user.name ? 'Shared by ' + list.owner_name : 'Owner: You'"></span>
                                        <span class="text-blue-600 dark:text-blue-400 font-medium">Open →</span>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <div x-show="lists.length === 0" class="text-center py-12 text-gray-500 text-xs">
                            <p>No checklists found. Click "+ New" to create your first list!</p>
                        </div>
                    </div>
                </template>

                <!-- ACTIVE LIST WORKSPACE VIEW -->
                <template x-if="activeList">
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4">
                        <div class="flex justify-between items-center mb-3">
                            <p class="text-[11px] text-gray-500 dark:text-gray-400" x-text="activeList.is_resettable ? 'Manual Reset Daily List' : 'Standard List'"></p>
                            <div class="flex space-x-2">
                                <button x-show="activeList.is_resettable && String(activeList.user_id) === String(user.id)" @click="resetList()" class="bg-amber-600 hover:bg-amber-700 text-white px-2 py-1 rounded text-[11px] font-medium transition">
                                    Reset
                                </button>
                                <button x-show="String(activeList.user_id) === String(user.id)" @click="deleteList(activeList.id)" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 text-[11px] font-medium px-1 py-1">
                                    Delete
                                </button>
                            </div>
                        </div>

                        <!-- Add Task Input -->
                        <form @submit.prevent="addTask" class="flex gap-2 mb-3">
                            <input type="text" x-model="newTaskTitle" placeholder="Add a new item..." 
                                   class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Add</button>
                        </form>

                        <!-- Pending Tasks (Compacted) -->
                        <div class="space-y-1.5 mb-3">
                            <template x-for="(task, index) in pendingTasks" :key="task.id">
                                <div class="flex items-center justify-between px-2.5 py-1.5 bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-gray-200 dark:border-gray-800">
                                    <label class="flex items-center space-x-2.5 cursor-pointer flex-1">
                                        <input type="checkbox" @change="toggleTaskStatus(task)" class="w-3.5 h-3.5 text-blue-600 rounded focus:ring-blue-500">
                                        <span class="text-xs" x-text="task.title"></span>
                                    </label>
                                    <div class="flex items-center space-x-1">
                                        <!-- Reorder Buttons -->
                                        <div class="flex space-x-0.5">
                                            <button type="button" @click="moveTask(index, 'up')" class="text-[10px] px-1.5 py-0.5 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600">▲</button>
                                            <button type="button" @click="moveTask(index, 'down')" class="text-[10px] px-1.5 py-0.5 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600">▼</button>
                                        </div>
                                        <button @click="deleteTask(task.id)" class="text-gray-400 hover:text-red-600 dark:hover:text-red-400 text-xs ml-1 px-1">×</button>
                                    </div>
                                </div>
                            </template>
                            <p x-show="pendingTasks.length === 0" class="text-xs text-gray-400 text-center py-2">No active tasks.</p>
                        </div>

                        <!-- Completed Tasks Section (Compacted) -->
                        <template x-if="completedTasks.length > 0">
                            <div class="border-t border-gray-200 dark:border-gray-700 pt-3">
                                <h3 class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Completed</h3>
                                <div class="space-y-1.5">
                                    <template x-for="task in completedTasks" :key="task.id">
                                        <div class="flex items-center justify-between px-2.5 py-1.5 bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-gray-200 dark:border-gray-800 opacity-75">
                                            <label class="flex items-center space-x-2.5 cursor-pointer flex-1">
                                                <input type="checkbox" checked @change="toggleTaskStatus(task)" class="w-3.5 h-3.5 text-blue-600 rounded focus:ring-blue-500">
                                                <span class="text-xs line-through" x-text="task.title"></span>
                                            </label>
                                            <button @click="deleteTask(task.id)" class="text-gray-400 hover:text-red-600 dark:hover:text-red-400 text-xs px-1">×</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- Share List Section (Owner Only) -->
                        <template x-if="String(activeList.user_id) === String(user.id)">
                            <div class="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700">
                                <h3 class="text-xs font-semibold mb-1.5">Share this List</h3>
                                <div class="flex space-x-2">
                                    <input type="email" x-model="shareEmail" placeholder="friend@example.com" 
                                           class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <button @click="shareList()" class="px-3 py-1 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">Share</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <template x-if="!user">
            <div class="text-center py-20">
                <h2 class="text-xl font-semibold mb-3">Welcome to Collaborative Checklists</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Sign in with your Google account to manage and share your lists.</p>
                <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-medium transition inline-block">
                    Sign in with Google
                </a>
            </div>
        </template>

        <!-- New List Modal -->
        <div x-show="showNewListModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
            <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-5 border border-gray-200 dark:border-gray-700">
                <h3 class="text-base font-semibold mb-3">Create New Checklist</h3>
                <form @submit.prevent="createList">
                    <div class="mb-3">
                        <label class="block text-xs font-medium mb-1">List Title</label>
                        <input type="text" x-model="newListTitle" required placeholder="e.g. Daily Chores" 
                               class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4 flex items-center space-x-2">
                        <input type="checkbox" id="resettable" x-model="newListResettable" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <label for="resettable" class="text-xs font-medium">Enable Manual Reset Button (Great for Daily Tasks)</label>
                    </div>
                    <div class="flex justify-end space-x-2">
                        <button type="button" @click="showNewListModal = false" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600">Cancel</button>
                        <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-700 text-white">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                user: {{ user | tojson if user else 'null' }},
                lists: [],
                activeList: null,
                tasks: [],
                newTaskTitle: '',
                shareEmail: '',
                showNewListModal: false,
                newListTitle: '',
                newListResettable: false,

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                },

                async init() {
                    if (this.user) {
                        await this.fetchLists();
                    }
                },

                showOverview() {
                    this.activeList = null;
                    this.tasks = [];
                },

                async fetchLists() {
                    const res = await fetch('/api/lists');
                    if (res.ok) {
                        this.lists = await res.json();
                        // Defaults to overview view (activeList = null)
                    }
                },

                async selectList(list) {
                    this.activeList = list;
                    await this.fetchTasks();
                },

                async fetchTasks() {
                    if (!this.activeList) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/tasks`);
                    if (res.ok) {
                        this.tasks = await res.json();
                    }
                },

                async createList() {
                    const res = await fetch('/api/lists', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: this.newListTitle, is_resettable: this.newListResettable })
                    });
                    if (res.ok) {
                        const newList = await res.json();
                        this.lists.unshift(newList);
                        this.newListTitle = '';
                        this.newListResettable = false;
                        this.showNewListModal = false;
                        this.selectList(newList);
                    }
                },

                async deleteList(id) {
                    if (!confirm("Are you sure you want to delete this list?")) return;
                    const res = await fetch(`/api/lists/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        this.lists = this.lists.filter(l => l.id !== id);
                        this.showOverview();
                    }
                },

                async addTask() {
                    if (!this.newTaskTitle.trim() || !this.activeList) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/tasks`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: this.newTaskTitle })
                    });
                    if (res.ok) {
                        const task = await res.json();
                        this.tasks.unshift(task);
                        this.newTaskTitle = '';
                    }
                },

                async toggleTaskStatus(task) {
                    const newStatus = task.status === 'pending' ? 'completed' : 'pending';
                    const res = await fetch(`/api/tasks/${task.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                    if (res.ok) {
                        task.status = newStatus;
                    }
                },

                async deleteTask(id) {
                    const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        this.tasks = this.tasks.filter(t => t.id !== id);
                    }
                },

                async resetList() {
                    if (!this.activeList) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/reset`, { method: 'POST' });
                    if (res.ok) {
                        await this.fetchTasks();
                    }
                },

                async moveTask(index, direction) {
                    let pending = this.pendingTasks;
                    let targetIndex = direction === 'up' ? index - 1 : index + 1;
                    if (targetIndex < 0 || targetIndex >= pending.length) return;

                    let temp = pending[index];
                    pending[index] = pending[targetIndex];
                    pending[targetIndex] = temp;

                    let newTasks = [...pending, ...this.completedTasks];
                    this.tasks = newTasks;

                    let task_ids = this.tasks.map(t => t.id);
                    await fetch(`/api/lists/${this.activeList.id}/reorder`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ task_ids })
                    });
                },

                async shareList() {
                    if (!this.shareEmail.trim()) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/share`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: this.shareEmail })
                    });
                    if (res.ok) {
                        alert('List shared successfully!');
                        this.shareEmail = '';
                    } else {
                        const err = await res.json();
                        alert(err.detail || 'Failed to share list');
                    }
                },

                get pendingTasks() {
                    return this.tasks.filter(t => t.status === 'pending');
                },

                get completedTasks() {
                    return this.tasks.filter(t => t.status === 'completed');
                }
            }
        }
    </script>
</body>
</html>
