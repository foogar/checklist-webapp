<!DOCTYPE html>
<html lang="en" x-data="app()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Checklist</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200 dark:border-gray-800">
            <h1 class="text-2xl font-bold tracking-tight">Checklists</h1>
            
            <div class="flex items-center space-x-4">
                <!-- Dark Mode Toggle -->
                <button @click="toggleDarkMode()" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
                    <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>

                <!-- Auth Section -->
                <template x-if="user">
                    <div class="flex items-center space-x-3">
                        <span class="text-sm font-medium text-gray-600 dark:text-gray-300" x-text="user.name"></span>
                        <a href="/auth/logout" class="text-sm text-red-600 dark:text-red-400 hover:underline">Logout</a>
                    </div>
                </template>
                <template x-if="!user">
                    <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                        Sign in with Google
                    </a>
                </template>
            </div>
        </header>

        <!-- Main Content (Only if Logged In) -->
        <template x-if="user">
            <div>
                <!-- Create List Form / Tabs -->
                <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <!-- Tabs -->
                    <div class="flex flex-wrap gap-2 border-b border-gray-200 dark:border-gray-800 pb-2 w-full sm:w-auto">
                        <template x-for="list in lists" :key="list.id">
                            <button @click="selectList(list)"
                                    :class="activeList && activeList.id === list.id ? 'bg-blue-600 text-white' : 'bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700'"
                                    class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                                <span x-text="list.title"></span>
                                <span x-show="list.owner_name && list.owner_name !== user.name" class="text-xs opacity-75" x-text="'(' + list.owner_name + ')'"></span>
                            </button>
                        </template>
                    </div>

                    <!-- New List Trigger -->
                    <button @click="showNewListModal = true" class="whitespace-nowrap bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
                        + New List
                    </button>
                </div>

                <!-- Active List Workspace -->
                <template x-if="activeList">
                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h2 class="text-xl font-semibold" x-text="activeList.title"></h2>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" x-text="activeList.is_resettable ? 'Manual Reset Daily List' : 'Standard List'"></p>
                            </div>
                            <div class="flex space-x-2">
                                <button x-show="activeList.is_resettable && activeList.user_id === user.id" @click="resetList()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                                    Reset List
                                </button>
                                <button x-show="activeList.user_id === user.id" @click="deleteList(activeList.id)" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 text-xs font-medium px-2 py-1">
                                    Delete List
                                </button>
                            </div>
                        </div>

                        <!-- Add Task Input -->
                        <form @submit.prevent="addTask" class="flex gap-2 mb-6">
                            <input type="text" x-model="newTaskTitle" placeholder="Add a new task..." 
                                   class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Add</button>
                        </form>

                        <!-- Pending Tasks -->
                        <div class="space-y-2 mb-6">
                            <template x-for="task in pendingTasks" :key="task.id">
                                <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-gray-200 dark:border-gray-800">
                                    <label class="flex items-center space-x-3 cursor-pointer flex-1">
                                        <input type="checkbox" @change="toggleTaskStatus(task)" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                                        <span class="text-sm" x-text="task.title"></span>
                                    </label>
                                    <button @click="deleteTask(task.id)" class="text-gray-400 hover:text-red-600 dark:hover:text-red-400 text-sm">×</button>
                                </div>
                            </template>
                            <p x-show="pendingTasks.length === 0" class="text-sm text-gray-400 text-center py-4">No active tasks.</p>
                        </div>

                        <!-- Completed Tasks Section -->
                        <template x-if="completedTasks.length > 0">
                            <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
                                <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400 mb-3">Completed</h3>
                                <div class="space-y-2">
                                    <template x-for="task in completedTasks" :key="task.id">
                                        <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-900/50 rounded-lg border border-gray-200 dark:border-gray-800 opacity-75">
                                            <label class="flex items-center space-x-3 cursor-pointer flex-1">
                                                <input type="checkbox" checked @change="toggleTaskStatus(task)" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                                                <span class="text-sm line-through" x-text="task.title"></span>
                                            </label>
                                            <button @click="deleteTask(task.id)" class="text-gray-400 hover:text-red-600 dark:hover:text-red-400 text-sm">×</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="!activeList && lists.length === 0">
                    <div class="text-center py-12 text-gray-500">
                        <p>No checklists found. Create your first list to get started!</p>
                    </div>
                </template>
            </div>
        </template>

        <template x-if="!user">
            <div class="text-center py-20">
                <h2 class="text-2xl font-semibold mb-4">Welcome to Collaborative Checklists</h2>
                <p class="text-gray-500 dark:text-gray-400 mb-6">Sign in with your Google account to manage and share your lists.</p>
                <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-medium transition inline-block">
                    Sign in with Google
                </a>
            </div>
        </template>

        <!-- New List Modal -->
        <div x-show="showNewListModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
            <div class="bg-white dark:bg-gray-800 rounded-xl max-w-md w-full p-6 border border-gray-200 dark:border-gray-700">
                <h3 class="text-lg font-semibold mb-4">Create New Checklist</h3>
                <form @submit.prevent="createList">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-1">List Title</label>
                        <input type="text" x-model="newListTitle" required placeholder="e.g. Daily Chores" 
                               class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-6 flex items-center space-x-2">
                        <input type="checkbox" id="resettable" x-model="newListResettable" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <label for="resettable" class="text-sm font-medium">Enable Manual Reset Button (Great for Daily Tasks)</label>
                    </div>
                    <div class="flex justify-end space-x-3">
                        <button type="button" @click="showNewListModal = false" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600">Cancel</button>
                        <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                darkMode: localStorage.getItem('darkMode') === 'true',
                user: {{ user | tojson if user else 'null' }},
                lists: [],
                activeList: null,
                tasks: [],
                newTaskTitle: '',
                showNewListModal: false,
                newListTitle: '',
                newListResettable: false,

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                },

                async init() {
                    if (this.user) {
                        await this.fetchLists();
                    }
                },

                async fetchLists() {
                    const res = await fetch('/api/lists');
                    if (res.ok) {
                        this.lists = await res.json();
                        if (this.lists.length > 0 && !this.activeList) {
                            this.selectList(this.lists[0]);
                        } else if (this.activeList) {
                            // Keep active list reference updated
                            this.activeList = this.lists.find(l => l.id === this.activeList.id) || this.lists[0] || null;
                        }
                    }
                },

                async selectList(list) {
                    this.activeList = list;
                    await this.fetchTasks();
                },

                async fetchTasks() {
                    if (!this.activeList) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/tasks`);
                    if (res.ok) {
                        this.tasks = await res.json();
                    }
                },

                async createList() {
                    const res = await fetch('/api/lists', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: this.newListTitle, is_resettable: this.newListResettable })
                    });
                    if (res.ok) {
                        const newList = await res.json();
                        this.lists.unshift(newList);
                        this.newListTitle = '';
                        this.newListResettable = false;
                        this.showNewListModal = false;
                        this.selectList(newList);
                    }
                },

                async deleteList(id) {
                    if (!confirm("Are you sure you want to delete this list?")) return;
                    const res = await fetch(`/api/lists/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        this.lists = this.lists.filter(l => l.id !== id);
                        this.activeList = this.lists.length > 0 ? this.lists[0] : null;
                        if (this.activeList) await this.fetchTasks();
                    }
                },

                async addTask() {
                    if (!this.newTaskTitle.trim() || !this.activeList) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/tasks`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: this.newTaskTitle })
                    });
                    if (res.ok) {
                        const task = await res.json();
                        this.tasks.unshift(task);
                        this.newTaskTitle = '';
                    }
                },

                async toggleTaskStatus(task) {
                    const newStatus = task.status === 'pending' ? 'completed' : 'pending';
                    const res = await fetch(`/api/tasks/${task.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: newStatus })
                    });
                    if (res.ok) {
                        task.status = newStatus;
                    }
                },

                async deleteTask(id) {
                    const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        this.tasks = this.tasks.filter(t => t.id !== id);
                    }
                },

                async resetList() {
                    if (!this.activeList) return;
                    const res = await fetch(`/api/lists/${this.activeList.id}/reset`, { method: 'POST' });
                    if (res.ok) {
                        await this.fetchTasks();
                    }
                },

                get pendingTasks() {
                    return this.tasks.filter(t => t.status === 'pending');
                },

                get completedTasks() {
                    return this.tasks.filter(t => t.status === 'completed');
                }
            }
        }
    </script>
</body>
</html>
